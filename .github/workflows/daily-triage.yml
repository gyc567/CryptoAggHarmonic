name: Daily Triage

on:
  schedule:
    # Weekdays at 09:00 UTC
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/loop-state
            docs/agents
            loop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run loop doctor
        run: python -m loop.loop doctor .

      - name: Run loop audit
        run: python -m loop.loop audit . --json > audit.json

      - name: Read current STATE.md
        id: state
        run: |
          if [ -f docs/loop-state/STATE.md ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Triage issues
        id: triage
        run: |
          echo "=== Daily Triage Report ===" > triage-report.md
          echo "Generated: $(date -Iseconds)" >> triage-report.md
          echo "" >> triage-report.md

          # Collect needs-triage issues
          NEEDS_TRIAGE=$(gh issue list --label "needs-triage" --state open --json number,title,labels --jq '.[] | "• #\(.number) \(.title) [\(.labels[].name | join(", "))]"' 2>/dev/null || echo "_none_")
          echo "### Needs Triage (\`needs-triage\`)" >> triage-report.md
          echo "$NEEDS_TRIAGE" >> triage-report.md
          echo "" >> triage-report.md

          # Collect needs-info issues
          NEEDS_INFO=$(gh issue list --label "needs-info" --state open --json number,title --jq '.[] | "• #\(.number) \(.title)"' 2>/dev/null || echo "_none_")
          echo "### Needs Info (\`needs-info\`)" >> triage-report.md
          echo "$NEEDS_INFO" >> triage-report.md
          echo "" >> triage-report.md

          # Collect ready-for-human issues
          READY_HUMAN=$(gh issue list --label "ready-for-human" --state open --json number,title --jq '.[] | "• #\(.number) \(.title)"' 2>/dev/null || echo "_none_")
          echo "### Ready for Human (\`ready-for-human\`)" >> triage-report.md
          echo "$READY_HUMAN" >> triage-report.md
          echo "" >> triage-report.md

          # Collect stale PRs (>3 days no activity)
          STALE_PRS=$(gh pr list --state open --search "created:<=$(date -d '3 days ago' +%Y-%m-%d)" --json number,title --jq '.[] | "• #\(.number) \(.title)"' 2>/dev/null || echo "_none_")
          echo "### Stale PRs (>3 days no activity)" >> triage-report.md
          echo "$STALE_PRS" >> triage-report.md
          echo "" >> triage-report.md

          # Collect draft PRs
          DRAFT_PRS=$(gh pr list --state open --label "draft" --json number,title --jq '.[] | "• #\(.number) \(.title)"' 2>/dev/null || echo "_none_")
          echo "### Draft PRs" >> triage-report.md
          echo "$DRAFT_PRS" >> triage-report.md

          echo "" >> triage-report.md
          echo "---" >> triage-report.md
          echo "*Generated by daily-triage.yml*">> triage-report.md

          echo "Triage report:"
          cat triage-report.md

          # Update STATE.md High Priority section if ready-for-human issues exist
          if gh issue list --label "ready-for-human" --state open --json number --jq 'length' 2>/dev/null | grep -q '[1-9]'; then
            echo "High Priority items found — updating STATE.md"
          fi

          # Count totals
          echo "NEEDS_TRIAGE_COUNT=$(echo "$NEEDS_TRIAGE" | grep -c "^•" || echo 0)" >> $GITHUB_OUTPUT
          echo "NEEDS_INFO_COUNT=$(echo "$NEEDS_INFO" | grep -c "^•" || echo 0)" >> $GITHUB_OUTPUT
          echo "READY_HUMAN_COUNT=$(echo "$READY_HUMAN" | grep -c "^•" || echo 0)" >> $GITHUB_OUTPUT
          echo "STALE_PRS_COUNT=$(echo "$STALE_PRS" | grep -c "^•" || echo 0)" >> $GITHUB_OUTPUT

      - name: Update STATE.md
        if: steps.state.outputs.exists == 'true'
        run: |
          # Append triage summary to loop-run-log.md
          {
            echo "### $(date -IsecondsZ) [daily-triage] loop=1 needs_triage=${{ steps.triage.outputs.NEEDS_TRIAGE_COUNT }} needs_info=${{ steps.triage.outputs.NEEDS_INFO_COUNT }} ready_human=${{ steps.triage.outputs.READY_HUMAN_COUNT }} stale_prs=${{ steps.triage.outputs.STALE_PRS_COUNT }} outcome=success"
          } >> docs/loop-state/loop-run-log.md

      - name: Post audit comment on latest PR
        if: always()
        run: |
          echo "Loop Readiness Score available at: docs/loop-state/audit.json"
          cat audit.json || echo "No audit data"

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ------------------------------------------------------------------
      # Three-layer defense CI gates (mypy + pyright + contract tests).
      # Layer order: L1 type-check → L2 contract tests → full pytest run.
      # Order matters because contract failures almost always indicate a
      # caller passed bad inputs that a stricter L1 check would have
      # caught earlier in development.
      # ------------------------------------------------------------------

      - name: Layer 1 - mypy (trusted core)
        run: mypy app/domain/signals.py app/domain/schemas.py

      - name: Layer 1 - pyright (trusted core)
        run: pyright app/domain/signals.py app/domain/schemas.py

      - name: Layer 2 + Layer 3 - contract tests (fast)
        run: |
          pytest -q \
            tests/test_signals_contract.py \
            tests/test_schemas_contract.py \
            tests/test_schemas_aux_contract.py \
            tests/test_services_contract.py \
            tests/test_api_validation.py

      # ------------------------------------------------------------------
      # Linting + formatting gate (ruff + black).
      # Block-on-fail so PRs cannot regress the codebase past the formatting
      # baseline. Pinned versions in requirements-dev.txt match this gate.
      # ------------------------------------------------------------------
      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Black format check
        run: black --check app/ tests/

      - name: Run backend tests
        run: |
          pytest -q --cov=app --cov-report=term-missing -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Type check
        run: npm run type-check
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

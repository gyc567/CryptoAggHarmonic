name: Debt Harvesting

# Monthly: summarizes code volume trend and updates Durable Facts.
# Tracks net line changes per module over time (no ponytail: comment dependency).
# L1: report only, human decides what (if anything) to act on.

on:
  schedule:
    # First day of each month at 11:00 UTC
    - cron: "0 11 1 * *"
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app/services
            app/api
            loop
            skills
            patterns
            docs/loop-state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Count lines per module (monthly snapshot)
        id: snapshot
        run: |
          MODULES="app/services app/api loop skills patterns"

          echo "=== Code Volume Snapshot $(date +%Y-%m-%d) ===" > snapshot.txt
          echo "" >> snapshot.txt

          for module in $MODULES; do
            if [ -d "$module" ]; then
              LINES=$(find "$module" -name '*.py' -o -name '*.yaml' -o -name '*.yml' -o -name '*.md' 2>/dev/null \
                | grep -v __pycache__ | grep -v '\.pyc' \
                | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
              echo "$module: $LINES lines" >> snapshot.txt
              echo "${module//\//_}_lines=$LINES" >> $GITHUB_OUTPUT
            fi
          done

          echo "" >> snapshot.txt
          echo "Generated: $(date -Iseconds)" >> snapshot.txt
          cat snapshot.txt

      - name: Read historical snapshots
        id: history
        run: |
          DEBT_FILE="docs/loop-state/PONYTAIL-DEBT.md"

          if [ -f "$DEBT_FILE" ]; then
            echo "Existing debt ledger found:"
            tail -20 "$DEBT_FILE"
          else
            echo "No existing debt ledger — will create new."
          fi

      - name: Generate debt report
        id: report
        run: |
          DATE=$(date +%Y-%m-%d)

          # Read previous snapshot from durable-facts.md if exists
          PREV_LINES=$(grep -oP '\d+(?= lines$)' docs/loop-state/durable-facts.md 2>/dev/null | tail -1 || echo "")
          CURR_LINES=${OUTPUT_app_services_lines:-0}

          NET_CHANGE=0
          if [ -n "$PREV_LINES" ]; then
            NET_CHANGE=$((CURR_LINES - PREV_LINES))
          fi

          echo "monthly_net_change=$NET_CHANGE" >> $GITHUB_OUTPUT

          # Build markdown report
          {
            echo "# Ponytail Debt Report"
            echo ""
            echo "Generated: $(date -Iseconds)"
            echo ""
            echo "## Code Volume Trend (monthly)"
            echo ""
            echo "| Date | Module | Lines | MoM Change |"
            echo "|------|--------|-------|-----------|"

            for module in app/services app/api loop skills patterns; do
              key="${module//\//_}_lines"
              lines=${!key:-0}
              echo "| $(date +%Y-%m-%d) | \`$module\` | $lines | ${NET_CHANGE} |"
            done

            echo ""
            echo "## Notes"
            echo ""
            echo "Net change represents monthly code volume delta across all tracked modules."
            echo "Positive = bloat accumulation. Negative = cleanup progress."
            echo ""
            echo "This report is generated by \`.github/workflows/debt-harvesting.yml\`."
            echo "It tracks code volume trend, not \`ponytail:\` comments."
          } > PONYTAIL-DEBT.md

          echo ""
          echo "=== Debt Report ==="
          cat PONYTAIL-DEBT.md

      - name: Copy report to docs/loop-state/
        run: |
          cp PONYTAIL-DEBT.md docs/loop-state/PONYTAIL-DEBT.md
          echo "Report saved to docs/loop-state/PONYTAIL-DEBT.md"

      - name: Update durable-facts.md with monthly snapshot
        run: |
          DATE=$(date +%Y-%m-%d)
          CURR_LINES=${OUTPUT_app_services_lines:-0}
          CURR_API=${OUTPUT_app_api_lines:-0}
          CURR_LOOP=${OUTPUT_loop_lines:-0}

          # Append to Code Volume Trend table in durable-facts.md
          DEBT_FILE="docs/loop-state/durable-facts.md"
          if [ ! -f "$DEBT_FILE" ]; then
            echo "# Durable Facts — pyharmonics-gpt" > "$DEBT_FILE"
            echo "" >> "$DEBT_FILE"
          fi

          # Check if Code Volume Trend section exists
          if grep -q "## Code Volume Trend" "$DEBT_FILE"; then
            # Append to existing table
            # Find last non-empty line in the table and add after
            python3 -c "
import re
with open('$DEBT_FILE', 'r') as f:
    content = f.read()

# Find the Code Volume Trend table
pattern = r'(## Code Volume Trend.*?\n)(\|.*?\n(\|.*?\n)*)'
match = re.search(pattern, content, re.DOTALL)
if match:
    last_row = match.group(2).strip().split('\n')[-1]
    new_row = '| $(date +%Y-%m-%d) | app/services | $CURR_LINES | \${OUTPUT_app_api_lines:-0} |'
    content = content.replace(last_row, last_row + '\n' + new_row)

with open('$DEBT_FILE', 'w') as f:
    f.write(content)
"
          else
            # Add new section before any superseded_by markers
            SECTION="
## Code Volume Trend

> Tracked monthly by debt-harvesting.yml. Units: lines of code.

| Date | Module | Lines | Monthly Δ |
|------|--------|-------|-----------|
| $DATE | app/services | $CURR_LINES | — |
| $DATE | app/api | $CURR_API | — |
| $DATE | loop | $CURR_LOOP | — |

"
            python3 -c "
with open('$DEBT_FILE', 'r') as f:
    content = f.read()
# Insert before <!-- Entries are append-only --> or at end
marker = '<!-- Entries are append-only -->'
if marker in content:
    idx = content.find(marker)
    content = content[:idx] + '''$SECTION
''' + content[idx:]
else:
    content += '''$SECTION
'''
with open('$DEBT_FILE', 'w') as f:
    f.write(content)
"
          fi

          echo "Updated durable-facts.md with monthly snapshot"

      - name: Update loop-run-log.md
        run: |
          NET=${OUTPUT_monthly_net_change:-0}
          {
            echo "### $(date -IsecondsZ) [debt-harvesting] net_change=$NET outcome=success"
          } >> docs/loop-state/loop-run-log.md

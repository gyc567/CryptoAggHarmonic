name: Loop Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/loop-state
            docs/adr
            loop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run loop audit
        id: audit
        run: python -m loop.loop audit . --json > audit.json

      - name: Check gate.yaml
        run: python -m loop.loop gate check .

      - name: Check sync
        run: python -m loop.loop sync check .

      - name: Post audit result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const score = audit.score;
            const level = audit.level;
            const passed = score >= 58;

            const emoji = passed ? '✅' : '⚠️';
            const body = `${emoji} **Loop Readiness Score: ${score}/100 [${level}]**\n\n` +
              (passed ? 'Loop engineering infrastructure is ready.' : 'Loop infrastructure needs attention. Run `python -m loop.loop audit . --suggest` for details.');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

            if (!passed) {
              core.setFailed(`Loop Readiness Score ${score} is below minimum 58`);
            }
